name: 🐛 Bug Report
description: 버그를 제보해주세요
title: "[BUG] "
labels: ["backend","bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 버그 리포트
        문제를 최대한 구체적으로 작성해주세요. 재현 가능해야 빠르게 해결할 수 있습니다.

  - type: input
    id: summary
    attributes:
      label: 📌 요약
      description: 버그에 대한 간단한 설명
      placeholder: ex) 로그인 시 500 에러 발생
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📖 상세 설명
      description: 어떤 문제가 발생했는지 자세히 작성해주세요
      placeholder: |
        어떤 상황에서 발생했는지,
        어떤 동작을 했는지 작성해주세요
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 재현 방법
      description: 버그를 재현하는 단계
      placeholder: |
        1. 로그인 페이지 이동
        2. 아이디/비밀번호 입력
        3. 로그인 버튼 클릭
        4. 에러 발생
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 결과
      description: 실제로 발생한 결과
      placeholder: 500 Internal Server Error 발생
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 🧾 로그 / 에러 메시지
      description: 관련 로그나 에러 메시지를 붙여주세요
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: 🌍 환경
      description: 문제가 발생한 환경
      options:
        - Local
        - Dev
        - Staging
        - Production
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 📎 추가 정보
      description: 참고할 만한 내용이 있으면 작성해주세요(선택)