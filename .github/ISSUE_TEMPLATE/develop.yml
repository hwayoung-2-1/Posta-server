name: 🚀 Develop Request
description: 새로운 기능 개발 요청
title: "[FEAT] "
labels: ["feature", "backend"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 기능 요청
        필요한 기능을 명확하게 설명해주세요.

  - type: input
    id: summary
    attributes:
      label: 📌 기능 요약
      placeholder: ex) 사용자 프로필 수정 기능 추가
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 📖 배경 / 문제
      description: 왜 이 기능이 필요한가?
      placeholder: |
        현재 어떤 문제가 있고,
        이 기능이 왜 필요한지 설명
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 해결 방법
      description: 어떻게 구현할지 제안
      placeholder: |
        - API 추가
        - UI 변경
        - DB 구조 변경 등
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 대안
      description: 다른 방법이 있다면 작성

  - type: dropdown
    id: priority
    attributes:
      label: ⚡ 우선순위
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 📎 추가 정보