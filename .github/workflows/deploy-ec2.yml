name: Build and Deploy to EC2

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-key-for-jwt-must-be-at-least-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: |
          set -euo pipefail

          chmod +x ./gradlew

      - name: Build and test
        run: |
          set -euo pipefail

          ./gradlew clean build --no-daemon

      - name: Prepare boot jar artifact
        run: |
          set -euo pipefail

          mkdir -p build/deploy

          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain*.jar' | head -n 1)"
          if [ -z "${jar_path}" ]; then
            echo "::error::Boot jar not found in build/libs"
            exit 1
          fi

          cp "${jar_path}" build/deploy/app.jar

      - name: Upload boot jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/deploy/app.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT || 22 }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      ENV_PROD_CONTENT: ${{ secrets.ENV_PROD_CONTENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download boot jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: deploy

      - name: Validate deployment secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for name in EC2_HOST EC2_USER EC2_SSH_KEY ENV_PROD_CONTENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -p "${EC2_PORT}" -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        run: |
          set -euo pipefail

          test -f deploy/app.jar

          printf '%s\n' "${ENV_PROD_CONTENT}" > /tmp/hwayoung.env.prod
          chmod 600 /tmp/hwayoung.env.prod

      - name: Upload build artifact to EC2
        run: |
          set -euo pipefail

          scp -i ~/.ssh/ec2_key -P "${EC2_PORT}" deploy/app.jar "${EC2_USER}@${EC2_HOST}:/tmp/hwayoung-app.jar"
          scp -i ~/.ssh/ec2_key -P "${EC2_PORT}" docker/docker-compose.cd.yml "${EC2_USER}@${EC2_HOST}:/tmp/hwayoung-docker-compose.cd.yml"
          scp -i ~/.ssh/ec2_key -P "${EC2_PORT}" /tmp/hwayoung.env.prod "${EC2_USER}@${EC2_HOST}:/tmp/hwayoung.env.prod"

      - name: Run deployment on EC2
        run: |
          set -euo pipefail

          deploy_path="${EC2_DEPLOY_PATH:-}"
          printf -v quoted_deploy_path '%q' "${deploy_path}"

          ssh -i ~/.ssh/ec2_key -p "${EC2_PORT}" "${EC2_USER}@${EC2_HOST}" "EC2_DEPLOY_PATH=${quoted_deploy_path} bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is not installed on EC2" >&2
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose is not available on EC2" >&2
            exit 1
          fi

          deploy_path="${EC2_DEPLOY_PATH:-}"
          if [ -z "${deploy_path}" ]; then
            deploy_path="${HOME}/hwayoung-server"
          fi

          case "${deploy_path}" in
            /|/home|/opt|/var|/usr|/tmp)
              echo "Refusing unsafe EC2_DEPLOY_PATH: ${deploy_path}" >&2
              exit 1
              ;;
          esac

          deploy_user="$(id -un)"
          deploy_group="$(id -gn)"

          if ! mkdir -p "${deploy_path}/app" "${deploy_path}/docker" 2>/dev/null; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "Cannot create ${deploy_path}. Set EC2_DEPLOY_PATH to a writable path, such as ${HOME}/hwayoung-server." >&2
              exit 1
            fi

            if ! sudo -n true 2>/dev/null; then
              echo "Cannot create ${deploy_path}. The EC2 user needs write permission or passwordless sudo." >&2
              exit 1
            fi

            sudo -n mkdir -p "${deploy_path}/app" "${deploy_path}/docker"
            sudo -n chown -R "${deploy_user}:${deploy_group}" "${deploy_path}"
          fi

          if [ -d "${deploy_path}" ]; then
            cd "${deploy_path}"

            if [ -f ".env.prod" ] && [ -f "docker/docker-compose.cd.yml" ]; then
              docker compose --env-file .env.prod -f docker/docker-compose.cd.yml down --remove-orphans
            fi

            if [ -f ".env.prod" ] && [ -f "docker/docker-compose.prod.yml" ]; then
              docker compose --env-file .env.prod -f docker/docker-compose.prod.yml down --remove-orphans
            fi

            rm -f app/app.jar
          fi

          mv /tmp/hwayoung-app.jar "${deploy_path}/app/app.jar"
          mv /tmp/hwayoung-docker-compose.cd.yml "${deploy_path}/docker/docker-compose.cd.yml"
          mv /tmp/hwayoung.env.prod "${deploy_path}/.env.prod"
          chmod 600 "${deploy_path}/.env.prod"

          cd "${deploy_path}"

          docker compose --env-file .env.prod -f docker/docker-compose.cd.yml up -d
          docker compose --env-file .env.prod -f docker/docker-compose.cd.yml ps

          rm -f /tmp/hwayoung-app.jar /tmp/hwayoung-docker-compose.cd.yml
          REMOTE
