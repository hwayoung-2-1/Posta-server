spring:
  datasource:
    url: jdbc:h2:mem:hwayoung-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    vectorstore:
      type: none
      pgvector:
        initialize-schema: false
jwt:
  secret: we-are-bssm-project-internship-hwayoung-team1
  expiration: 43200000
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
app:
  portfolio:
    pdf:
      max-size-bytes: 52428800
      view-url-expiry-seconds: 600
  minio:
    endpoint: http://localhost:9000
    public-url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: hwayoung-portfolios-test
    url-mode: PRESIGNED
    public-read: false
    presigned-expiry-seconds: 3600
