spring:
  application:
    name: hwayoung-server
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  profiles:
    group:
      dev-create: dev,ddl-create
      dev-create-drop: dev,ddl-create-drop
      dev-update: dev,ddl-update
      dev-validate: dev,ddl-validate
      dev-none: dev,ddl-none
      prod-create: prod,ddl-create
      prod-create-drop: prod,ddl-create-drop
      prod-update: prod,ddl-update
      prod-validate: prod,ddl-validate
      prod-none: prod,ddl-none
jwt:
  secret: ${JWT_SECRET}
  expiration: 43200000
app:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:hwayoung-portfolios}
    url-mode: ${MINIO_URL_MODE:PRESIGNED}
    public-read: ${MINIO_PUBLIC_READ:false}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:3600}
