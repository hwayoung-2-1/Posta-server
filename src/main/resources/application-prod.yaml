spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
  jpa:
    show-sql: false
app:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:hwayoung-portfolios}
    url-mode: ${MINIO_URL_MODE:PRESIGNED}
    public-read: ${MINIO_PUBLIC_READ:false}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:3600}
