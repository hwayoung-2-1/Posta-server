spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
  jpa:
    show-sql: false
server:
  forward-headers-strategy: framework
app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:hwayoung-portfolios}
    region: ${MINIO_REGION:us-east-1}
    url-mode: ${MINIO_URL_MODE:PRESIGNED}
    public-read: ${MINIO_PUBLIC_READ:false}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:3600}
