services:
  postgres:
    image: postgres:16
    container_name: hwayoung-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hwayoung-redis-dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: gradle:9.3.1-jdk17
    container_name: hwayoung-app-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - gradle-dev-cache:/home/gradle/.gradle
    command: ["sh", "-c", "chmod +x ./gradlew && ./gradlew bootRun --no-daemon"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_ACTIVE_PROFILES:-dev,ddl-update}

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME}}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}

    ports:
      - "${APP_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-dev-data:
  redis-dev-data:
  gradle-dev-cache:
