services:
  postgres:
    image: postgres:16
    container_name: hwayoung-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hwayoung-redis-dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hwayoung-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-dev-data:/data

  app:
    image: gradle:9.3.1-jdk17
    container_name: hwayoung-app-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - gradle-dev-cache:/home/gradle/.gradle
    command: ["sh", "-c", "chmod +x ./gradlew && ./gradlew bootRun --no-daemon"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_ACTIVE_PROFILES:-dev,ddl-update}

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME}}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-hwayoung-portfolios}
      MINIO_URL_MODE: ${MINIO_URL_MODE:-PRESIGNED}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
      MINIO_PRESIGNED_EXPIRY_SECONDS: ${MINIO_PRESIGNED_EXPIRY_SECONDS:-3600}

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "${APP_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-dev-data:
  redis-dev-data:
  minio-dev-data:
  gradle-dev-cache:
